name: Build Floating Bubble APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -q https://github.com/gradle/gradle/releases/download/v8.4.0/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          cp gradle-8.4/lib/plugins/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar
          rm -rf gradle-8.4 gradle-8.4-bin.zip

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBubble-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
